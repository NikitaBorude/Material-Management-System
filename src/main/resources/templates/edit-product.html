<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, rgb(255, 255, 255), #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background:linear-gradient(to right, rgb(0, 0, 0), #764ba2);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #434190;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Edit Product</h2>

	<form th:action="@{/product/update}" th:object="${product}" method="post">

	    <!-- CSRF -->
	    <input type="hidden"
	           th:name="${_csrf.parameterName}"
	           th:value="${_csrf.token}" />

	    <!-- ID hidden -->
	    <input type="hidden" th:field="*{id}" />

	    <label>Product Name:</label>
	    <input type="text" th:field="*{name}" required>

	    <label>Category:</label>
	    <input type="text" th:field="*{category}" required>

	    <label>Price:</label>
	    <input type="number" step="0.01" th:field="*{price}" required>

	    <label>Quantity:</label>
	    <input type="number" th:field="*{quantity}" required>

	    <label>MFG Date:</label>
	    <input type="date" th:field="*{mfgDate}">

	    <label>EXP Date:</label>
	    <input type="date" th:field="*{expDate}">

	    <button type="submit">Update Product</button>

	</form>

</div>

</body>
</html>
