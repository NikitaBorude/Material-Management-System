<!DOCTYPE html>
<html>
<head>
    <title>Purchase List</title>
	<style>
		body {
		            font-family: Arial, sans-serif;
		            background: linear-gradient(to right, rgb(255, 255, 255), #764ba2);
		            margin: 0;
		            padding: 0;
		        }


		/* NAVBAR */
		.navbar {
		    background: #2c3e50;
		    padding: 15px 30px;
		    display: flex;
		    justify-content: center;
		}

		.navbar a {
		    color: white;
		    text-decoration: none;
		    margin: 0 15px;
		    font-weight: 600;
		    transition: 0.3s;
		}

		.navbar a:hover {
		    color: #ffd369;
		}

	

		/* HEADINGS */
		h2 {
		    text-align: center;
		    color: #333;
		    margin-bottom: 25px;
			
		}

		
		/* TABLE */
		table {
		    width: 100%;
		    border-collapse: collapse;
		    margin-top: 20px;
		}

		th {
		    background: rgb(64, 0, 128);
		    color: white;
		    padding: 12px;
		}

		td {
		    padding: 10px;
		    border-bottom: 1px solid rgb(0, 0, 0);
		    text-align: center;
		}

		tr:hover {
		    background-color: #f2f2f2;
		}
		
		/*button*/
		.action-btn {
		    padding: 6px 12px;
		    border-radius: 5px;
		    text-decoration: none;
		    color: rgb(0, 0, 0);
		     font-size: 14px;
			 margin: 0 3px;
		    display: inline-block;
		   }
				  		
				          
		  .edit-btn {
			 background-color: #3498db;
		   }

		  .edit-btn:hover {
			 background-color: #2980b9;
		    }

		  .delete-btn {
		     background-color: #e74c3c;
		    }
		  
		  .delete-btn:hover {
			 background-color: #c0392b;
			} 

		
	</style>
</head>
<body>
	<div class="navbar">
	    <a href="/dashboard">Home</a>
	    <a href="/product/add">Add Product</a>
	    <a href="/product/view">View Products</a>
	    <a href="/supplier/add">Add Supplier</a>
	    <a href="/supplier/view">View Supplier</a>
		<a href="/purchase/add">Add Purchase</a>
		<a href="/purchase/view">View Purchase</a>
	    <a href="/billing">Sale</a>
	</div>

	<h2>Purchase History</h2>

	<table border="1">
	    <tr>
	        <th>ID</th>
	        <th>Product</th>
	        <th>Supplier</th>
	        <th>Quantity</th>
	        <th>Date</th>
	        <th>Action</th>
	    </tr>

	    <tr th:each="p : ${purchases}">
	        <td th:text="${p.id}"></td>
	        <td th:text="${p.product.name}"></td>
	        <td th:text="${p.supplier.name}"></td>
	        <td th:text="${p.quantity}"></td>
	        <td th:text="${p.purchaseDate}"></td>

			<td>
			  <a th:href="@{'/product/edit/' + ${p.id}}"
			   class="action-btn edit-btn">
			   Edit
			  </a>

			<a th:href="@{'/product/delete/' + ${p.id}}"
			class="action-btn delete-btn"
			onclick="return confirm('Are you sure you want to delete this product?')">
			 Delete
			 </a>
			</td>
	    </tr>
	</table>
