<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales History</title>

    <style>
		body {
		           font-family: Arial, sans-serif;
		           background: linear-gradient(to right, rgb(255, 255, 255), #764ba2);
		           margin: 0;
		           padding: 0;
		       }

        h2 {
            text-align: center;
            margin-top: 20px;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
        }

        td {
            padding: 8px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        a {
            text-decoration: none;
            background: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 2px;
        }

        .delete-btn {
            background: #e74c3c;
        }
    </style>
</head>

<body>

<h2>Sales History</h2>

<table border="1">

    <tr>
        <th>Invoice No</th>
        <th>Customer</th>
        <th>Date</th>
        <th>Total Amount</th>
        <th>Action</th>
    </tr>

    <tr th:each="s : ${list}">
        <td th:text="${s.invoiceNumber}"></td>
        <td th:text="${s.customerName}"></td>
        <td th:text="${s.saleDate}"></td>

        <!-- Safe formatted total -->
        <td th:text="'₹ ' + ${#numbers.formatDecimal(s.totalAmount, 1, 2)}"></td>

        <td>
            <a th:href="@{/invoice/{id}(id=${s.id})}">View</a>

            <a th:href="@{/delete-sale/{id}(id=${s.id})}"
               class="delete-btn"
               onclick="return confirm('Are you sure you want to delete this sale?')">
                Delete
            </a>
        </td>
    </tr>

</table>

</body>
</html>
