<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Report</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffffff, #764ba2);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        /* CARD */
        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: 600;
            display:block;
            margin-bottom:6px;
            font-size:14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size:14px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 8px rgba(118,75,162,0.3);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #000000, #764ba2);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Customer Complaint Form</h2>

    <form th:action="@{/reports/save}" th:object="${report}" method="post">

        <label>Name</label>
        <input type="text" th:field="*{customerName}" required>

        <label>Contact</label>
        <input type="text" th:field="*{contactNumber}" required>

        <label>Product</label>
        <input type="text" th:field="*{productName}" required>

        <label>Issue Type</label>
        <input type="text" th:field="*{issueType}" required>

        <label>Description</label>
        <textarea th:field="*{description}"></textarea>

        <button type="submit">Submit Report</button>

    </form>

</div>

</body>
</html>
