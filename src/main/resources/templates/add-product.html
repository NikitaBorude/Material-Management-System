<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
	<style>
	body {
		
		            font-family: Arial, sans-serif;
		            background: linear-gradient(to right, rgb(255, 255, 255), #764ba2);
		            margin: 0;
		            padding: 0;
		        }

	


	/* NAVBAR */
	.navbar {
	    background: #2c3e50;
	    padding: 15px 30px;
	    display: flex;
	    justify-content: center;
	}

	.navbar a {
	    color: white;
	    text-decoration: none;
	    margin: 0 15px;
	    font-weight: 600;
	    transition: 0.3s;
	}

	.navbar a:hover {
	    color: #ffd369;
	}

	/* CARD CONTAINER */
	.container {
	    width: 500px;              /* form chhota ho jayega */
	    margin: 60px auto;         /* center me aa jayega */
	    background: white;
	    padding: 30px 40px;
	    border-radius: 15px;
	    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
	}

	/* HEADINGS */
	h2 {
	    text-align: center;
	    color: #333;
	    margin-bottom: 25px;
	}

	/* FORM INPUTS */
	input, select {
	    width: 100%;
	    padding: 10px;
	    margin-bottom: 18px;
	    border-radius: 6px;
	    border: 1px solid rgb(0, 0, 0);
	    transition: 0.3s;
	}

	input:focus, select:focus {
	    border-color: rgb(128, 0, 255);
	    outline: none;
	    box-shadow: 0 0 8px rgb(0, 0, 0);
	}

	/* BUTTON */
	button {
	    width: 100%;
	    padding: 12px;
	    background: linear-gradient(to right, rgb(0, 0, 0), #764ba2);
	    border: none;
	    color: white;
	    font-size: 16px;
	    border-radius: 6px;
	    cursor: pointer;
	    transition: 0.3s;
	}

	button:hover {
	    transform: scale(1.05);
	    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
	}

	
	</style>
</head>
<body>

<div class="navbar">
    <a href="/dashboard">Home</a>
    <a href="/product/add">Add Product</a>
    <a href="/product/view">View Products</a>
    <a href="/supplier/add">Add Supplier</a>
    <a href="/supplier/view">View Supplier</a>
    <a href="/purchase/add">Add Purchase</a>
	<a href="/purchase/view">View Purchase</a>
    <a href="/billing">Sale</a>
</div>

<div class="container">
    <h2>Add Product</h2>

    <form action="/product/save" method="post">
		
		<input type="hidden" 
		           th:name="${_csrf.parameterName}" 
		           th:value="${_csrf.token}" />
				   
        Product Name:
        <input type="text" name="name" required>

        Category:
        <input type="text" name="category" required>

        Price:
        <input type="number" step="0.01" name="price" required>

        Quantity:
        <input type="number" name="quantity" required>

        MFG Date:
        <input type="date" name="mfgDate">

        EXP Date:
        <input type="date" name="expDate">

        <button type="submit">Save Product</button>
    </form>
</div>

</body>
</html>
