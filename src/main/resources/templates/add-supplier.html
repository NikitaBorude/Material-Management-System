<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Supplier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffffff, #764ba2);
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar{
            background:#2c3e50;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            margin:0 15px;
            text-decoration:none;
            font-weight:600;
        }

        /* Card Form */
        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            font-weight:600;
        }

        /* Inputs */
        input, textarea, select{
            width:100%;
            padding:8px;
            margin-bottom:12px;
            border-radius:5px;
            border:1px solid black;
        }

        textarea{
            resize:none;
        }

        /* Button */
        button{
            width:100%;
            padding:12px;
            background:linear-gradient(to right, black, #764ba2);
            border:none;
            color:white;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#764ba2;
        }

    </style>
</head>
<body>

<div class="navbar">
    <a href="/dashboard">Home</a>
    <a href="/product/add">Add Product</a>
    <a href="/product/view">View Products</a>
    <a href="/supplier/add">Add Supplier</a>
    <a href="/supplier/view">View Supplier</a>
    <a href="/purchase/add">Add Purchase</a>
    <a href="/purchase/view">View Purchase</a>
    <a href="/billing">Sale</a>
</div>

<div class="container">

    <h2>Add Supplier</h2>

    <!-- IMPORTANT: th:object ADD KIYA -->
	<form th:action="@{/supplier/save}" th:object="${supplier}" method="post">

	    Name:
	    <input type="text" th:field="*{name}" required><br><br>

	    Phone:
	    <input type="text" th:field="*{phone}" required><br><br>

	    Email:
	    <input type="email" th:field="*{email}" required><br><br>

	    Address:
	    <textarea th:field="*{address}" required></textarea><br><br>

	    Status:
	    <select th:field="*{active}">
	        <option th:value="true">Active</option>
	        <option th:value="false">Deactive</option>
	    </select><br><br>

	    <button type="submit">Save Supplier</button>

	</form>

</div>

</body>
</html>
