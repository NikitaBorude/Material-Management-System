<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales - Material Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, rgb(255, 255, 255), #764ba2);
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar {
            background: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: 600;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Card Form */
        .container {
            width: 420px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background:linear-gradient(to right, rgb(0, 0, 0), #764ba2);
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5563d1;
        }

        /* Error message */
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="navbar">
    <a href="/dashboard">Home</a>
    <a href="/product/add">Add Product</a>
    <a href="/product/view">View Products</a>
    <a href="/supplier/add">Add Supplier</a>
    <a href="/supplier/view">View Supplier</a>
    <a href="/purchase/add">Add Purchase</a>
    <a href="/purchase/view">View Purchase</a>
    <a href="/billing">Sale</a>
</div>

<div class="container">

    <h2>Generate Sales Bill</h2>

    <!-- STOCK ERROR MESSAGE -->
    <div th:if="${param.error == 'stock'}" class="error">
        ⚠ Insufficient stock available!
    </div>

    <form th:action="@{/save-bill}" method="post">

        <label>Customer Name</label>
        <input type="text" name="customerName" required>

        <label>Select Product</label>
        <select name="productId" required>
            <option value="">-- Select Product --</option>
            <option th:each="p : ${products}"
                    th:value="${p.id}"
                    th:text="${p.name + ' (Stock: ' + p.quantity + ')'}">
            </option>
        </select>

        <label>Payment Mode</label>
        <select name="paymentMode" required>
            <option value="">-- Select Payment Mode --</option>
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" required>

        <button type="submit">Generate Bill</button>

    </form>

</div>

</body>
</html>
